services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: clickhouse
    restart: unless-stopped
    # ~30% da VPS (16 GB / 4 vCPU), que é compartilhada com outros projetos
    cpus: 1.2
    mem_limit: 5g
    memswap_limit: 5g
    cpu_shares: 512 # prioridade menor que os outros containers (padrão 1024) quando houver disputa
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "14123:8123" # Interface HTTP / Web
      - "14200:9000" # Cliente nativo / TCP
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - ./data:/var/lib/clickhouse
      - ./backups:/backups
      - ./logs:/var/log/clickhouse-server
      - ./clickhouse/config.xml:/etc/clickhouse-server/config.d/listen.xml:ro
      - ./clickhouse/low-resources.xml:/etc/clickhouse-server/config.d/low-resources.xml:ro
      - ./clickhouse/users-low-resources.xml:/etc/clickhouse-server/users.d/low-resources.xml:ro
    networks:
      - clickhouse-network

networks:
  clickhouse-network:
    name: clickhouse-network
